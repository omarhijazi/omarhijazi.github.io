<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Fastly Swag</title>
  <link rel="icon" href="images/icon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="/_fs-ch-1T1wmsGaOgGaSxcX/assets/script.js"></script>
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a class="brand" href="index.html"><img src="images/logo.png" alt="" />Fastly Swag</a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="images.html">Gallery</a>
      <a href="search.html">Search</a>
      <a href="cart.html">Cart</a>
      <a href="login.html">Sign in</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h2 style="margin-top:28px;">Sign in</h2>
  <form class="panel" onsubmit="return handleLogin(event)">
    <label for="email">Email</label>
    <input id="email" name="email" type="text" autocomplete="off" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="off" />
    <div id="login-error" class="form-error"></div>
    <button type="submit">Sign in</button>
  </form>
  <p style="margin-top:14px;"><a href="register.html">Create an account</a></p>
  <p style="margin-top:6px; color:#8a938e; font-size:13px;">Password is checked by a real backend at <code>/api/login</code> — try <code>demo1234</code> for success, anything else for failure, or a common breached password to trigger Deception.</p>
</main>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    var errorEl = document.getElementById("login-error");
    errorEl.style.display = "none";

    try {
      var response = await fetch("api/login", {
        method: "POST",
        body: new URLSearchParams({ email: email, password: password }),
      });
      var data = await response.json().catch(function () { return {}; });

      // Purely driven by what the backend actually decided -- no
      // client-side password check exists anywhere in this file.
      // If Fastly's Deception rule swapped the password before this
      // request reached the backend, the backend still rejects it
      // normally, and that's exactly what shows up here.
      if (data.result === "success") {
        window.location.href = "account.html";
      } else {
        errorEl.textContent = "Invalid email or password.";
        errorEl.style.display = "block";
      }
    } catch (err) {
      errorEl.textContent = "Request failed.";
      errorEl.style.display = "block";
    }
  }
</script>

<footer class="site">
  <div class="wrap">
    &copy; 2026 Fastly Swag. Not a real store.
  </div>
</footer>

</body>
</html>
