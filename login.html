<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Fastly Swag</title>
  <link rel="icon" href="images/icon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="/_fs-ch-1T1wmsGaOgGaSxcX/assets/script.js"></script>
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a class="brand" href="index.html"><img src="images/logo.png" alt="" />Fastly Swag</a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="images.html">Gallery</a>
      <a href="search.html">Search</a>
      <a href="cart.html">Cart</a>
      <a href="login.html">Sign in</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h2 style="margin-top:28px;">Sign in</h2>
  <form class="panel" onsubmit="return handleLogin(event)">
    <label for="email">Email</label>
    <input id="email" name="email" type="text" autocomplete="off" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="off" />
    <div id="login-error" class="form-error"></div>
    <button type="submit">Sign in</button>
  </form>
  <p style="margin-top:14px;"><a href="register.html">Create an account</a></p>
  <p style="margin-top:6px; color:#8a938e; font-size:13px;">Demo login: <code>demo@fastlyswag.com</code> / <code>demo1234</code></p>
</main>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    var errorEl = document.getElementById("login-error");
    var success = email === "demo@fastlyswag.com" && password === "demo1234";

    // Always await this -- on success we navigate away right after,
    // and an un-awaited fetch gets cancelled by that navigation
    // before it's actually sent.
    try {
      await fetch("api/login.json", {
        method: "POST",
        body: new URLSearchParams({
          email: email,
          password: password,
          result: success ? "success" : "failure",
        }),
      });
    } catch (err) {
      // Network/method errors (e.g. 404/405 from a static host) are
      // expected here and fine -- the POST still reached Fastly.
    }

    if (success) {
      window.location.href = "account.html";
    } else {
      errorEl.textContent = "Invalid email or password.";
      errorEl.style.display = "block";
    }
  }
</script>

<footer class="site">
  <div class="wrap">
    &copy; 2026 Fastly Swag. Not a real store.
  </div>
</footer>

</body>
</html>
