<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus Demo | Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Nimbus</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html" class="btn-nav">Login</a>
    </nav>
  </header>

  <div class="center-wrap">
    <div class="login-card">
      <img src="images/lock-logo.svg" alt="Lock icon" class="logo-mark">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue to your dashboard</p>

      <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>

      <p class="hint">Demo credentials: <code>username</code> / <code>password</code></p>
    </div>
  </div>

  <footer>
    &copy; 2026 Nimbus Demo — Built for testing purposes on GitHub Pages.
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
